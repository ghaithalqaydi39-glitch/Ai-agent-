<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Chat</title>
    <style>
        body { font-family: sans-serif; background: #0f0f13; color: #fff; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 75%; line-height: 1.4; word-break: break-word; }
        .user { background: #6200ee; align-self: flex-end; }
        .ai { background: #1e1e24; align-self: flex-start; border: 1px solid #333; }
        #input-area { display: flex; padding: 15px; background: #16161a; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #0f0f13; color: #fff; font-size: 16px; }
        button { padding: 0 20px; background: #bb86fc; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div class="message ai">Hello! I am your AI agent. How can I help you today?</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            // Display user message in chat
            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                // Send prompt to your backend server.js route
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                const replyText = data.reply || data.error || "No response.";
                
                // Display AI response in chat
                container.innerHTML += `<div class="message ai">${replyText}</div>`;
            } catch (err) {
                container.innerHTML += `<div class="message ai" style="color:#ff5555;">Error connecting to agent.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
